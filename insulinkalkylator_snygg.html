<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insulinkalkylator med Säkerhetsspärr</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .calculator-container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 22px;
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .radio-group {
            display: flex;
            gap: 10px;
        }
        .radio-label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: normal;
            transition: all 0.2s ease;
        }
        .radio-group input[type="radio"] {
            display: none;
        }
        .radio-group input[type="radio"]:checked + .radio-label {
            background: #e8f4fd;
            border-color: #3b82f6;
            font-weight: bold;
        }
        .icon {
            width: 20px;
            height: 20px;
            display: inline-block;
            vertical-align: middle;
        }
        .icon-fill {
            fill: #333;
        }
        .icon-stroke {
            fill: none;
            stroke: #333;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
        }
        input[type="number"]:focus {
            border-color: #3b82f6;
            outline: none;
        }
        .results-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            border-left: 4px solid #3b82f6;
        }
        .total-dose {
            font-size: 24px;
            font-weight: bold;
            color: #1e3a8a;
            margin-bottom: 5px;
        }
        .breakdown {
            font-size: 14px;
            color: #4b5563;
        }
        .toggle-btn {
            background: none;
            border: none;
            color: #3b82f6;
            cursor: pointer;
            padding: 0;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
        }
        .settings-panel {
            display: none;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 1px dashed #dee2e6;
        }
        .tip-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }
        .tip-low {
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: #991b1b;
        }
        .tip-high {
            background-color: #fffbeb;
            border: 1px solid #fef3c7;
            color: #92400e;
        }
        .tip-normal {
            background-color: #f0fdf4;
            border: 1px solid #dcfce7;
            color: #166534;
        }
        .disclaimer {
            font-size: 11px;
            color: #6b7280;
            margin-top: 25px;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <h1>Insulinkalkylator med Säkerhetsspärr</h1>

    <!-- Tid på dygnet -->
    <div class="form-group">
        <label>Tid på dygnet</label>
        <div class="radio-group">
            <input type="radio" id="dag" name="tid" value="dag" checked onchange="calculateDose()">
            <label for="dag" class="radio-label">
                <!-- Sol-ikon med kontur (Stilren) -->
                <svg class="icon icon-stroke" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                Dagtid
            </label>

            <input type="radio" id="natt" name="tid" value="natt" onchange="calculateDose()">
            <label for="natt" class="radio-label">
                <!-- Måne-ikon med kontur (Stilren) -->
                <svg class="icon icon-stroke" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                Natt
            </label>
        </div>
    </div>

    <!-- Måltidstyp -->
    <div class="form-group">
        <label>Måltidstyp</label>
        <div class="radio-group">
            <input type="radio" id="frukost" name="maltid" value="frukost" checked onchange="calculateDose()">
            <label for="frukost" class="radio-label">
                <!-- Kaffekopp-ikon med kontur (Stilren) -->
                <svg class="icon icon-stroke" viewBox="0 0 24 24">
                    <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                    <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                    <line x1="6" y1="1" x2="6" y2="4"></line>
                    <line x1="10" y1="1" x2="10" y2="4"></line>
                    <line x1="14" y1="1" x2="14" y2="4"></line>
                </svg>
                Frukost
            </label>

            <input type="radio" id="ovrig" name="maltid" value="ovrig" onchange="calculateDose()">
            <label for="ovrig" class="radio-label">
                <!-- Svart fylld tallrik med kniv och gaffel (Stilren fylld) -->
                <svg class="icon icon-fill" viewBox="0 0 24 24">
                    <!-- Gaffel till vänster -->
                    <path d="M3 2v5c0 1.1.9 2 2 2h1v11h2V9h1c1.1 0 2-.9 2-2V2H9v5H8V2H6v5H5V2H3z"/>
                    <!-- Kniv i mitten -->
                    <path d="M13 2v8h2v10h2V2s-4 1-4 0z"/>
                    <!-- Tallrik till höger -->
                    <path d="M20 6c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4zm0 6.5c-1.4 0-2.5-1.1-2.5-2.5s1.1-2.5 2.5-2.5 2.5 1.1 2.5 2.5-1.1 2.5-2.5 2.5z"/>
                </svg>
                Övrig måltid
            </label>
        </div>
    </div>

    <!-- Aktuellt BS -->
    <div class="form-group">
        <label for="bs">Aktuellt BS (mmol/L)</label>
        <input type="number" id="bs" value="10.0" step="0.1" min="0" oninput="calculateDose()">
    </div>

    <!-- Kolhydrater -->
    <div class="form-group">
        <label for="kh">Kolhydrater (g)</label>
        <input type="number" id="kh" value="0" min="0" oninput="calculateDose()">
    </div>

    <!-- Resultat -->
    <div class="results-box">
        <div class="total-dose" id="totalDose">0.0 E</div>
        <div class="breakdown" id="breakdownText">Mat: 0.0 E | Korr: 0.0 E</div>
    </div>

    <!-- Tipsruta för insulindelning/timing -->
    <div id="tipBox" class="tip-box tip-normal"></div>

    <!-- Inställningar och kvoter -->
    <button class="toggle-btn" onclick="toggleSettings()">Inställningar och Kvoter ▼</button>
    
    <div id="settingsPanel" class="settings-panel">
        <div class="form-group">
            <label for="tdd">TDD (Styrande referens)</label>
            <input type="number" id="tdd" value="40" oninput="updateKvoter()">
        </div>
        <div class="form-group">
            <label for="frukostKvot">Frukostkvot (g/E) (300-regeln)</label>
            <input type="number" id="frukostKvot" readonly>
        </div>
        <div class="form-group">
            <label for="ovrigKvot">Övrig kvot (g/E) (500-regeln)</label>
            <input type="number" id="ovrigKvot" readonly>
        </div>
        <div class="form-group">
            <label for="korrDag">Korr.kvot Dag (mmol/L) (100-regeln)</label>
            <input type="number" id="korrDag" readonly>
        </div>
        <div class="form-group">
            <label for="korrNatt">Korr.kvot Natt (mmol/L) (200-regeln)</label>
            <input type="number" id="korrNatt" readonly>
        </div>
        <div class="form-group">
            <label for="malval">Målvärde BS (mmol/L)</label>
            <input type="number" id="malval" value="6.0" step="0.1" oninput="calculateDose()">
        </div>
    </div>

    <div class="disclaimer">
        This is for informational purposes only. For medical advice or diagnosis, consult a professional. AI responses may include mistakes.
    </div>
</div>

<script>
function toggleSettings() {
    var panel = document.getElementById("settingsPanel");
    if (panel.style.display === "block") {
        panel.style.display = "none";
    } else {
        panel.style.display = "block";
    }
}

function updateKvoter() {
    var tdd = parseFloat(document.getElementById("tdd").value) || 40;
    
    // Beräkna kvoter enligt standardregler
    document.getElementById("frukostKvot").value = (300 / tdd).toFixed(1);
    document.getElementById("ovrigKvot").value = (500 / tdd).toFixed(1);
    document.getElementById("korrDag").value = (100 / tdd).toFixed(1);
    document.getElementById("korrNatt").value = (200 / tdd).toFixed(1);
    
    calculateDose();
}

function calculateDose() {
    var bs = parseFloat(document.getElementById("bs").value) || 0;
    var kh = parseFloat(document.getElementById("kh").value) || 0;
    var malval = parseFloat(document.getElementById("malval").value) || 6.0;
    
    var isDag = document.getElementById("dag").checked;
    var isFrukost = document.getElementById("frukost").checked;
    
    var khKvot = isFrukost ? parseFloat(document.getElementById("frukostKvot").value) : parseFloat(document.getElementById("ovrigKvot").value);
    var korrKvot = isDag ? parseFloat(document.getElementById("korrDag").value) : parseFloat(document.getElementById("korrNatt").value);
    
    // Matdos
    var matDose = khKvot > 0 ? kh / khKvot : 0;
    
    // Korrigeringsdos
    var korrDose = 0;
    if (bs > malval && korrKvot > 0) {
        korrDose = (bs - malval) / korrKvot;
    }
    
    // Totaldos (Säkerhetsspärr: Ingen negativ dos)
    var totalDose = Math.max(0, matDose + korrDose);
    
    // Uppdatera UI
    document.getElementById("totalDose").innerText = totalDose.toFixed(1) + " E";
    document.getElementById("breakdownText").innerText = "Mat: " + matDose.toFixed(1) + " E | Korr: " + korrDose.toFixed(1) + " E";
    
    // Uppdatera tipsruta baserat på aktuellt BS
    updateTipBox(bs);
}

function updateTipBox(bs) {
    var tipBox = document.getElementById("tipBox");
    
    if (bs < 4.5) {
        tipBox.className = "tip-box tip-low";
        tipBox.innerHTML = "<strong>💡 Tips vid lågt blodsocker (&lt; 4.5 mmol/L):</strong> Du ligger lågt innan maten. Om du ska äta en större portion, överväg att dela upp dosen. Ta en mindre del (eller inget) i början för att låta blodsockret stiga, och ta resten efter måltiden. Åtgärda alltid en eventuell akut känning först!";
    } else if (bs > 8.0) {
        tipBox.className = "tip-box tip-high";
        tipBox.innerHTML = "<strong>💡 Tips vid högt blodsocker (&gt; 8.0 mmol/L):</strong> Ditt startvärde är högt. Ge insulinet ett försprång (pre-bolus) genom att ta dosen 15–30 minuter innan du börjar äta den stora portionen. Det hjälper till att kapa den kommande blodsockertoppen.";
    } else {
        tipBox.className = "tip-box tip-normal";
        tipBox.innerHTML = "<strong>💡 Tips vid stabilt blodsocker (4.5 - 8.0 mmol/L):</strong> Ditt värde är stabilt. Vid en normal stor måltid tas dosen vanligtvis i direkt anslutning till maten. Tänk på att om maten innehåller mycket fett och protein kan kolhydratupptaget fördröjas, vilket också kan motivera en delad dos.";
    }
}

// Kör vid start för att initiera värden
updateKvoter();
</script>

</body>
</html>
